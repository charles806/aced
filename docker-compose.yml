services:
  db:
    image: postgres:16
    container_name: aced-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev1234
      POSTGRES_DB: aced_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d aced_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data: