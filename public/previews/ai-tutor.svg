<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
<title id="title">ACED AI Tutor chat preview</title>
<defs>
  <style>
    .paper { fill: #fdfaf4; }
    .window-stroke { stroke: #e7e0d2; }
    .card { fill: #ffffff; stroke: #ece6da; }
    .ink { fill: #37373d; }
    .ink-soft { fill: #9b9ba3; }
    .accent { fill: #ff4e88; }
    .accent-soft { fill: #ffe3ec; }
    .accent-ink { fill: #c81f58; }
    .line { stroke: #ece6da; }
    .serif { font-family: Georgia, "Playfair Display", serif; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  </style>
</defs>

<rect x="20" y="20" width="1160" height="740" rx="24" class="paper window-stroke" stroke-width="1.5"/>
<rect x="20" y="20" width="1160" height="52" rx="24" fill="#ffffff" class="window-stroke" stroke-width="1.5"/>
<rect x="20" y="48" width="1160" height="24" fill="#ffffff"/>
<circle cx="52" cy="46" r="6" fill="#ff4e88"/>
<circle cx="78" cy="46" r="6" fill="#fecaca" opacity="0.9"/>
<circle cx="104" cy="46" r="6" fill="#fde68a" opacity="0.9"/>
<text x="600" y="47" class="sans ink-soft" font-size="13" text-anchor="middle">AI Tutor</text>

<!-- context chips -->
<text x="80" y="116" class="serif ink" font-size="26" font-weight="700">Ask anything about your materials</text>
<rect x="80" y="142" width="200" height="40" rx="20" class="card"/>
<text x="108" y="167" class="sans ink" font-size="13">📄 Cell Bio notes</text>
<rect x="294" y="142" width="170" height="40" rx="20" class="card"/>
<text x="322" y="167" class="sans ink" font-size="13">📸 Chapter 9</text>
<rect x="478" y="142" width="190" height="40" rx="20" class="card"/>
<text x="506" y="167" class="sans ink" font-size="13">✨ Flashcards — Bio</text>

<!-- student question -->
<rect x="640" y="230" width="440" height="96" rx="18" fill="#f1ece1"/>
<text x="672" y="266" class="sans ink" font-size="15" font-weight="600">Ada</text>
<text x="672" y="294" class="sans ink-soft" font-size="14">Why does water move into the cell when we talk</text>
<text x="672" y="314" class="sans ink-soft" font-size="14">about osmosis? Explain with an example.</text>

<!-- AI reply -->
<rect x="80" y="370" width="560" height="230" rx="18" class="card"/>
<rect x="80" y="370" width="18" height="230" rx="9" class="accent"/>
<text x="120" y="412" class="sans ink" font-size="14" font-weight="700">ACED Tutor</text>
<text x="120" y="444" class="sans ink-soft" font-size="14">Water follows concentration. Osmosis is the net movement of</text>
<text x="120" y="464" class="sans ink-soft" font-size="14">water across a semipermeable membrane, from the side with more</text>
<text x="120" y="484" class="sans ink-soft" font-size="14">water (lower solute) toward higher solute concentration.</text>
<text x="120" y="518" class="sans ink-soft" font-size="14">Example: salt the leaves — water leaves the cells and they wilt.</text>
<text x="120" y="538" class="sans ink-soft" font-size="14">Fresh water does the reverse, and the cell swells.</text>
<rect x="120" y="558" width="190" height="30" rx="15" class="accent-soft"/>
<text x="150" y="578" class="sans accent-ink" font-size="12" font-weight="600">From your Bio notes →</text>

<!-- note overlay -->
<rect x="700" y="470" width="340" height="180" rx="14" class="card" transform="rotate(2 870 560)"/>
<rect x="716" y="486" width="60" height="10" rx="2" fill="#ffc6d9" transform="rotate(-3 746 491)"/>
<text x="716" y="530" class="sans ink" font-size="13" font-weight="600">Your question, answered</text>
<text x="716" y="556" class="sans ink-soft" font-size="12">· Answers reference your own notes</text>
<text x="716" y="578" class="sans ink-soft" font-size="12">· Ask follow-ups to go deeper</text>
<text x="716" y="600" class="sans ink-soft" font-size="12">· You stay in control of what you learn</text>

<rect x="80" y="644" width="1000" height="56" rx="28" class="card"/>
<text x="120" y="678" class="sans ink-soft" font-size="14">Ask a follow-up question…</text>
<circle cx="1030" cy="672" r="20" class="accent"/>
<path d="M1022 672 l8 8 l-8 8" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>