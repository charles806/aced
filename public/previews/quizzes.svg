<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
<title id="title">ACED quiz preview</title>
<defs>
  <style>
    .paper { fill: #fdfaf4; }
    .window-stroke { stroke: #e7e0d2; }
    .card { fill: #ffffff; stroke: #ece6da; }
    .ink { fill: #37373d; }
    .ink-soft { fill: #9b9ba3; }
    .accent { fill: #ff4e88; }
    .accent-soft { fill: #ffe3ec; }
    .accent-ink { fill: #c81f58; }
    .serif { font-family: Georgia, "Playfair Display", serif; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  </style>
</defs>

<rect x="20" y="20" width="1160" height="740" rx="24" class="paper window-stroke" stroke-width="1.5"/>
<rect x="20" y="20" width="1160" height="52" rx="24" fill="#ffffff" class="window-stroke" stroke-width="1.5"/>
<rect x="20" y="48" width="1160" height="24" fill="#ffffff"/>
<circle cx="52" cy="46" r="6" fill="#ff4e88"/>
<circle cx="78" cy="46" r="6" fill="#fecaca" opacity="0.9"/>
<circle cx="104" cy="46" r="6" fill="#fde68a" opacity="0.9"/>
<text x="600" y="47" class="sans ink-soft" font-size="13" text-anchor="middle">Quizzes</text>

<!-- progress -->
<text x="80" y="120" class="serif ink" font-size="26" font-weight="700">Biology · Chapter 9 quiz</text>
<text x="80" y="148" class="sans ink-soft" font-size="14">Question 3 of 8</text>
<rect x="80" y="170" width="1040" height="10" rx="5" fill="#f1ece1"/>
<rect x="80" y="170" width="390" height="10" rx="5" class="accent"/>

<!-- question card -->
<rect x="80" y="220" width="700" height="440" rx="20" class="card"/>
<text x="128" y="284" class="sans accent-ink" font-size="13" font-weight="700">QUESTION 3</text>
<text x="128" y="334" class="serif ink" font-size="24" font-weight="700">Which process allows water to move</text>
<text x="128" y="370" class="serif ink" font-size="24" font-weight="700">across a semipermeable membrane?</text>

<!-- options -->
<rect x="128" y="410" width="604" height="56" rx="14" class="card"/>
<text x="156" y="444" class="sans ink" font-size="15">A</text>
<text x="188" y="444" class="sans ink" font-size="15">Diffusion</text>

<rect x="128" y="482" width="604" height="56" rx="14" fill="#ffe3ec" stroke="#ff9cbf" stroke-width="1.5"/>
<text x="156" y="516" class="sans accent-ink" font-size="15" font-weight="700">B</text>
<text x="188" y="516" class="sans accent-ink" font-size="15" font-weight="600">Osmosis</text>
<circle cx="690" cy="510" r="14" class="accent"/>
<path d="M683 510 l5 5 l10 -10" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="128" y="554" width="604" height="56" rx="14" class="card"/>
<text x="156" y="588" class="sans ink" font-size="15">C</text>
<text x="188" y="588" class="sans ink" font-size="15">Active transport</text>

<!-- score panel -->
<rect x="820" y="220" width="300" height="440" rx="20" class="card" transform="rotate(1.4 970 440)"/>
<text x="856" y="278" class="serif ink" font-size="20" font-weight="700">Score so far</text>
<text x="856" y="340" class="serif accent-ink" font-size="56" font-weight="700">75%</text>
<text x="856" y="366" class="sans ink-soft" font-size="13">2 of 3 correct</text>

<circle cx="886" cy="424" r="15" fill="#dcfce7"/>
<path d="M879 424 l5 5 l9 -10" stroke="#15803d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="916" y="428" class="sans ink" font-size="13">Question 1</text>

<circle cx="886" cy="474" r="15" fill="#dcfce7"/>
<path d="M879 474 l5 5 l9 -10" stroke="#15803d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="916" y="478" class="sans ink" font-size="13">Question 2</text>

<circle cx="886" cy="524" r="15" fill="#ffe3ec"/>
<path d="M881 518 l10 10 M891 518 l-10 10" stroke="#ed2f6e" stroke-width="2.4" stroke-linecap="round"/>
<text x="916" y="528" class="sans ink" font-size="13">Question 3</text>

<rect x="856" y="580" width="220" height="44" rx="22" class="accent"/>
<text x="966" y="608" class="sans" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Next question</text>
</svg>