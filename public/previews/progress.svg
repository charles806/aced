<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
<title id="title">ACED study progress preview</title>
<defs>
  <style>
    .paper { fill: #fdfaf4; }
    .window-stroke { stroke: #e7e0d2; }
    .card { fill: #ffffff; stroke: #ece6da; }
    .ink { fill: #37373d; }
    .ink-soft { fill: #9b9ba3; }
    .accent { fill: #ff4e88; }
    .accent-soft { fill: #ffe3ec; }
    .accent-ink { fill: #c81f58; }
    .line { stroke: #ece6da; }
    .serif { font-family: Georgia, "Playfair Display", serif; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  </style>
</defs>

<rect x="20" y="20" width="1160" height="740" rx="24" class="paper window-stroke" stroke-width="1.5"/>
<rect x="20" y="20" width="1160" height="52" rx="24" fill="#ffffff" class="window-stroke" stroke-width="1.5"/>
<rect x="20" y="48" width="1160" height="24" fill="#ffffff"/>
<circle cx="52" cy="46" r="6" fill="#ff4e88"/>
<circle cx="78" cy="46" r="6" fill="#fecaca" opacity="0.9"/>
<circle cx="104" cy="46" r="6" fill="#fde68a" opacity="0.9"/>
<text x="600" y="47" class="sans ink-soft" font-size="13" text-anchor="middle">Study progress</text>

<!-- headline + streak -->
<text x="80" y="116" class="serif ink" font-size="26" font-weight="700">See how far you've come</text>
<rect x="80" y="146" width="260" height="150" rx="18" class="card" transform="rotate(-0.8 210 220)"/>
<circle cx="218" cy="216" r="50" fill="none" stroke="#f1ece1" stroke-width="13"/>
<circle cx="218" cy="216" r="50" fill="none" stroke="#ff4e88" stroke-width="13" stroke-linecap="round" stroke-dasharray="188 314" transform="rotate(-90 218 216)"/>
<text x="218" y="216" class="serif ink" font-size="20" font-weight="700" text-anchor="middle">12 day</text>
<text x="218" y="236" class="sans ink-soft" font-size="11" text-anchor="middle">streak</text>
<text x="80" y="268" class="sans ink-soft" font-size="12" text-anchor="middle">-</text>

<!-- monthly area chart -->
<rect x="360" y="120" width="760" height="320" rx="18" class="card"/>
<text x="392" y="160" class="serif ink" font-size="19" font-weight="700">Hours studied — last 30 days</text>
<g>
  <path d="M80 380 L400 360 L720 380" transform="translate(392,44)" fill="none"/>
  <path d="M0 0 C 40 -70, 70 -40, 110 -110 S 180 -160, 240 -120 S 320 -200, 400 -180 S 500 -230, 560 -190 S 620 -260, 660 -230" fill="none" stroke="#ff6ea1" stroke-width="3" stroke-linecap="round" transform="translate(392,386) scale(0.62)" opacity="0.9"/>
  <path d="M0 0 C 40 -70, 70 -40, 110 -110 S 180 -160, 240 -120 S 320 -200, 400 -180 S 500 -230, 560 -190 S 620 -260, 660 -230 L 660 0 Z" fill="#ffe3ec" opacity="0.45" transform="translate(392,386) scale(0.62)"/>
</g>
<g class="sans" text-anchor="middle">
  <text x="430" y="386" class="ink-soft" font-size="11">Sep 1</text>
  <text x="560" y="386" class="ink-soft" font-size="11">Sep 10</text>
  <text x="690" y="386" class="ink-soft" font-size="11">Sep 18</text>
  <text x="820" y="386" class="ink-soft" font-size="11">Sep 26</text>
  <text x="950" y="386" class="ink-soft" font-size="11">Oct 1</text>
</g>

<!-- subject progress panel -->
<rect x="80" y="470" width="540" height="250" rx="18" class="card"/>
<text x="112" y="508" class="serif ink" font-size="19" font-weight="700">Subject progress</text>
<text x="476" y="508" class="sans ink-soft" font-size="12">Year target</text>

<text x="112" y="548" class="sans ink" font-size="13" font-weight="600">Biology</text>
<rect x="112" y="560" width="470" height="12" rx="6" fill="#f1ece1"/>
<rect x="112" y="560" width="330" height="12" rx="6" fill="#ff4e88"/>
<text x="588" y="548" class="sans ink-soft" font-size="12" text-anchor="end">70%</text>

<text x="112" y="598" class="sans ink" font-size="13" font-weight="600">Algebra</text>
<rect x="112" y="610" width="470" height="12" rx="6" fill="#f1ece1"/>
<rect x="112" y="610" width="266" height="12" rx="6" fill="#a78bfa"/>
<text x="588" y="598" class="sans ink-soft" font-size="12" text-anchor="end">56%</text>

<text x="112" y="648" class="sans ink" font-size="13" font-weight="600">Chemistry</text>
<rect x="112" y="660" width="470" height="12" rx="6" fill="#f1ece1"/>
<rect x="112" y="660" width="198" height="12" rx="6" fill="#34d399"/>
<text x="588" y="648" class="sans ink-soft" font-size="12" text-anchor="end">42%</text>

<text x="112" y="696" class="sans ink" font-size="13" font-weight="600">History</text>
<rect x="112" y="708" width="470" height="12" rx="6" fill="#f1ece1"/>
<rect x="112" y="708" width="140" height="12" rx="6" fill="#fbbf24"/>
<text x="588" y="696" class="sans ink-soft" font-size="12" text-anchor="end">30%</text>

<!-- consistency mini-list -->
<rect x="640" y="470" width="480" height="250" rx="18" class="card"/>
<text x="672" y="508" class="serif ink" font-size="19" font-weight="700">Consistency</text>
<g>
  <rect x="672" y="534" width="26" height="26" rx="7" class="accent-soft"/>
  <path d="M679 548 l5 5 l8 -9" stroke="#ff4e88" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="716" y="552" class="sans ink" font-size="13" font-weight="600">Studied 8 of 7 days this week</text>

  <rect x="672" y="584" width="26" height="26" rx="7" class="accent-soft"/>
  <path d="M679 598 l5 5 l8 -9" stroke="#ff4e88" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="716" y="602" class="sans ink" font-size="13" font-weight="600">Longest streak · 12 days</text>

  <rect x="672" y="634" width="26" height="26" rx="7" fill="#f1ece1"/>
  <text x="685" y="650" class="sans ink-soft" font-size="13">⚡</text>
  <text x="716" y="652" class="sans ink" font-size="13" font-weight="600">+18% more study time this month</text>
</g>
<rect x="672" y="682" width="160" height="28" rx="14" class="accent-soft"/>
<text x="752" y="700" class="sans accent-ink" font-size="12" font-weight="600" text-anchor="middle">Great consistency</text>
</svg>