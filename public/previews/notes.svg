<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
<title id="title">ACED notes and subjects preview</title>
<defs>
  <style>
    .paper { fill: #fdfaf4; }
    .window-stroke { stroke: #e7e0d2; }
    .card { fill: #ffffff; stroke: #ece6da; }
    .ink { fill: #37373d; }
    .ink-soft { fill: #9b9ba3; }
    .accent { fill: #ff4e88; }
    .accent-soft { fill: #ffe3ec; }
    .accent-ink { fill: #c81f58; }
    .line { stroke: #ece6da; }
    .serif { font-family: Georgia, "Playfair Display", serif; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  </style>
</defs>

<rect x="20" y="20" width="1160" height="740" rx="24" class="paper window-stroke" stroke-width="1.5"/>
<rect x="20" y="20" width="1160" height="52" rx="24" fill="#ffffff" class="window-stroke" stroke-width="1.5"/>
<rect x="20" y="48" width="1160" height="24" fill="#ffffff"/>
<circle cx="52" cy="46" r="6" fill="#ff4e88"/>
<circle cx="78" cy="46" r="6" fill="#fecaca" opacity="0.9"/>
<circle cx="104" cy="46" r="6" fill="#fde68a" opacity="0.9"/>
<text x="600" y="47" class="sans ink-soft" font-size="13" text-anchor="middle">Notes &amp; Subjects</text>

<text x="80" y="116" class="serif ink" font-size="26" font-weight="700">Everything in one place</text>

<!-- subject cards -->
<g>
  <rect x="80" y="150" width="240" height="120" rx="16" class="card" transform="rotate(-1 200 210)"/>
  <rect x="104" y="176" width="40" height="40" rx="12" class="accent-soft"/>
  <text x="124" y="200" class="sans accent-ink" font-size="16" font-weight="700">B</text>
  <text x="160" y="192" class="sans ink" font-size="15" font-weight="600">Biology</text>
  <text x="160" y="210" class="sans ink-soft" font-size="12">12 notes · 4h studied</text>
  <rect x="104" y="228" width="150" height="14" rx="7" fill="#f1ece1"/>
  <rect x="104" y="228" width="96" height="14" rx="7" fill="#ffc6d9"/>

  <rect x="340" y="140" width="240" height="120" rx="16" class="card" transform="rotate(1.4 460 200)"/>
  <rect x="364" y="166" width="40" height="40" rx="12" fill="#ede9fe"/>
  <text x="384" y="190" class="sans" font-size="16" font-weight="700" fill="#6d28d9">A</text>
  <text x="420" y="182" class="sans ink" font-size="15" font-weight="600">Algebra</text>
  <text x="420" y="200" class="sans ink-soft" font-size="12">18 notes · 9h studied</text>
  <rect x="364" y="218" width="150" height="14" rx="7" fill="#f1ece1"/>
  <rect x="364" y="218" width="120" height="14" rx="7" fill="#c4b5fd"/>

  <rect x="600" y="150" width="240" height="120" rx="16" class="card" transform="rotate(-1.6 720 210)"/>
  <rect x="624" y="176" width="40" height="40" rx="12" fill="#fef3c7"/>
  <text x="644" y="200" class="sans" font-size="16" font-weight="700" fill="#b45309">H</text>
  <text x="680" y="192" class="sans ink" font-size="15" font-weight="600">History</text>
  <text x="680" y="210" class="sans ink-soft" font-size="12">9 notes · 3h studied</text>
  <rect x="624" y="228" width="150" height="14" rx="7" fill="#f1ece1"/>
  <rect x="624" y="228" width="72" height="14" rx="7" fill="#fcd34d"/>

  <rect x="860" y="140" width="240" height="120" rx="16" class="card" transform="rotate(1.2 980 200)"/>
  <rect x="884" y="166" width="40" height="40" rx="12" fill="#dcfce7"/>
  <text x="904" y="190" class="sans" font-size="16" font-weight="700" fill="#15803d">C</text>
  <text x="940" y="182" class="sans ink" font-size="15" font-weight="600">Chemistry</text>
  <text x="940" y="200" class="sans ink-soft" font-size="12">7 notes · 6h studied</text>
  <rect x="884" y="218" width="150" height="14" rx="7" fill="#f1ece1"/>
  <rect x="884" y="218" width="108" height="14" rx="7" fill="#86efac"/>
</g>

<!-- note list -->
<text x="80" y="330" class="serif ink" font-size="19" font-weight="700">Recent notes</text>
<g>
  <rect x="80" y="352" width="1060" height="72" rx="14" class="card"/>
  <rect x="108" y="374" width="42" height="28" rx="7" class="accent-soft"/>
