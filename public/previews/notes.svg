  <rect x="80" y="436" width="1060" height="72" rx="14" class="card"/>
  <rect x="108" y="458" width="42" height="28" rx="7" fill="#ede9fe"/>
  <text x="129" y="477" class="sans" font-size="11" font-weight="600" fill="#6d28d9">SCR</text>
  <text x="172" y="470" class="sans ink" font-size="14" font-weight="600">Quadratic formula practice</text>
  <text x="172" y="490" class="sans ink-soft" font-size="12">Algebra · yesterday</text>

  <rect x="80" y="520" width="1060" height="72" rx="14" class="card"/>
  <rect x="108" y="542" width="42" height="28" rx="7" fill="#fef3c7"/>
  <text x="129" y="561" class="sans" font-size="11" font-weight="600" fill="#b45309">IMG</text>
  <text x="172" y="554" class="sans ink" font-size="14" font-weight="600">WWI timeline — diagram</text>
  <text x="172" y="574" class="sans ink-soft" font-size="12">History · 2 days ago</text>
</g>

<!-- tape annotations -->
<rect x="880" y="620" width="230" height="76" rx="12" fill="#ffffff" transform="rotate(-2.2 995 658)" stroke="#ece6da" stroke-width="1"/>
<rect x="965" y="608" width="60" height="16" rx="2" fill="rgba(255,78,136,0.18)" transform="rotate(1 995 616)"/>
<text x="904" y="650" class="sans ink" font-size="13" font-weight="600">Search &amp; filter instantly</text>
<text x="904" y="672" class="sans ink-soft" font-size="12">by subject or file type</text>
</svg>