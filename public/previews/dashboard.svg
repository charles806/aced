<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
<title id="title">ACED dashboard preview</title>
<defs>
  <style>
    .paper { fill: #fdfaf4; }
    .window-stroke { stroke: #e7e0d2; }
    .card { fill: #ffffff; stroke: #ece6da; }
    .ink { fill: #37373d; }
    .ink-soft { fill: #9b9ba3; }
    .line { stroke: #ece6da; }
    .accent { fill: #ff4e88; }
    .accent-soft { fill: #ffe3ec; }
    .accent-ink { fill: #c81f58; }
    .serif { font-family: Georgia, "Playfair Display", serif; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  </style>
</defs>

<!-- window shell -->
<rect x="20" y="20" width="1160" height="740" rx="24" class="paper window-stroke" stroke-width="1.5"/>
<rect x="20" y="20" width="1160" height="52" rx="24" fill="#ffffff" class="window-stroke" stroke-width="1.5"/>
<rect x="20" y="48" width="1160" height="24" fill="#ffffff"/>
<circle cx="52" cy="46" r="6" fill="#ff4e88"/>
<circle cx="78" cy="46" r="6" fill="#fecaca" opacity="0.9"/>
<circle cx="104" cy="46" r="6" fill="#fde68a" opacity="0.9"/>
<rect x="36" y="346" width="24" height="24" rx="7" class="accent"/>
<text x="76" y="363" class="sans ink" font-size="17" font-weight="700">wind.</text>
<text x="608" y="46" class="sans ink-soft" font-size="13" text-anchor="middle">ACED</text>

<!-- sidebar -->
<rect x="20" y="72" width="230" height="688" fill="#fbf8f1"/>
<line x1="250" y1="72" x2="250" y2="760" class="line" stroke-width="1"/>
<rect x="44" y="92" width="20" height="20" rx="6" class="accent"/>
<text x="76" y="107" class="sans ink" font-size="15" font-weight="700">ACED</text>

<rect x="36" y="150" width="198" height="40" rx="11" class="accent-soft"/>
<circle cx="60" cy="170" r="8" fill="none" stroke="#ff4e88" stroke-width="2"/>
<path d="M55 170 l4 4 l8 -8" stroke="#ff4e88" stroke-width="2" fill="none"/>
<text x="80" y="175" class="sans accent-ink" font-size="14" font-weight="600">Dashboard</text>

<g>
<text x="62" y="238" class="sans ink-soft" font-size="14">Subjects</text>
<text x="62" y="292" class="sans ink-soft" font-size="14">Notes</text>
<text x="62" y="346" class="sans ink-soft" font-size="14">AI Tutor</text>
<text x="62" y="400" class="sans ink-soft" font-size="14">Upcoming</text>
<circle cx="58" cy="233" r="4" fill="#d9d3c4"/>
<circle cx="58" cy="287" r="4" fill="#d9d3c4"/>
<circle cx="58" cy="341" r="4" fill="#d9d3c4"/>
<circle cx="58" cy="395" r="4" fill="#d9d3c4"/>
</g>

<rect x="44" y="672" width="190" height="44" rx="22" fill="#1c1c1f"/>
<text x="139" y="699" class="sans" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Upgrade to Pro</text>

<!-- main column content -->
<text x="292" y="128" class="serif ink" font-size="34" font-weight="700">Good morning</text>
<text x="292" y="154" class="sans ink-soft" font-size="15">Tuesday · Ready to make progress?</text>

<rect x="292" y="180" width="150" height="44" rx="12" class="accent"/>
<text x="367" y="208" class="sans" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">New note</text>

<!-- stat cards -->
<g>
  <rect x="292" y="252" width="200" height="132" rx="16" class="card"/>
  <text x="316" y="288" class="sans ink-soft" font-size="13">Today</text>
  <text x="316" y="330" class="serif ink" font-size="30" font-weight="700">45m</text>
  <text x="316" y="356" class="sans ink-soft" font-size="12">2 sessions</text>

  <rect x="508" y="252" width="200" height="132" rx="16" class="card"/>
  <text x="532" y="288" class="sans ink-soft" font-size="13">Day streak</text>
  <text x="532" y="330" class="serif ink" font-size="30" font-weight="700">12</text>
  <text x="532" y="356" class="sans ink-soft" font-size="12">keep it going</text>

  <rect x="724" y="252" width="200" height="132" rx="16" class="card"/>
  <text x="748" y="288" class="sans ink-soft" font-size="13">Subjects</text>
  <text x="748" y="330" class="serif ink" font-size="30" font-weight="700">6</text>
  <text x="748" y="356" class="sans ink-soft" font-size="12">active courses</text>

  <rect x="940" y="252" width="200" height="132" rx="16" class="card"/>
  <text x="964" y="288" class="sans ink-soft" font-size="13">Notes</text>
  <text x="964" y="330" class="serif ink" font-size="30" font-weight="700">48</text>
  <text x="964" y="356" class="sans ink-soft" font-size="12">uploaded</text>
</g>

<!-- study timer + weekly chart -->
<rect x="292" y="412" width="420" height="290" rx="16" class="card"/>
<text x="316" y="448" class="serif ink" font-size="19" font-weight="700">Study timer</text>
<circle cx="400" cy="548" r="64" fill="none" stroke="#f1ece1" stroke-width="14"/>
<circle cx="400" cy="548" r="64" fill="none" stroke="#ff4e88" stroke-width="14" stroke-linecap="round" stroke-dasharray="201 402" transform="rotate(-90 400 548)"/>
<text x="400" y="543" class="serif ink" font-size="28" font-weight="700" text-anchor="middle">18:24</text>
<text x="400" y="566" class="sans ink-soft" font-size="11" text-anchor="middle">Bio · Chapter 9</text>
<rect x="508" y="470" width="180" height="46" rx="23" class="accent-soft"/>
<text x="598" y="498" class="sans accent-ink" font-size="14" font-weight="600" text-anchor="middle">Start</text>
<text x="508" y="642" class="sans ink-soft" font-size="12">Sessions this week · 4h 10m</text>

<rect x="728" y="412" width="412" height="290" rx="16" class="card"/>
<text x="752" y="448" class="serif ink" font-size="19" font-weight="700">Weekly progress</text>
<g>
  <rect x="760" y="560" width="30" height="70" rx="6" fill="#f1ece1"/>
  <rect x="812" y="530" width="30" height="100" rx="6" fill="#f1ece1"/>
  <rect x="864" y="570" width="30" height="60" rx="6" fill="#ffc6d9"/>
  <rect x="916" y="500" width="30" height="130" rx="6" fill="#f1ece1"/>
  <rect x="968" y="520" width="30" height="110" rx="6" fill="#ff6ea1"/>
  <rect x="1020" y="548" width="30" height="82" rx="6" fill="#f1ece1"/>
  <rect x="1072" y="498" width="30" height="132" rx="6" fill="#ff4e88"/>
</g>
<text x="774" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">M</text>
<text x="826" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">T</text>
<text x="878" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">W</text>
<text x="930" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">T</text>
<text x="982" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">F</text>
<text x="1034" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">S</text>
<text x="1086" y="606" class="sans ink-soft" font-size="10" text-anchor="middle">S</text>
<text x="752" y="674" class="sans ink-soft" font-size="12">+18% vs last week</text>
</svg>